<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Что приготовить? — Рецепты из того, что есть</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a2c1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Рецепты">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  
  <!-- Красивые шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍳 Что приготовить?</h1>
      <button id="themeToggle" class="theme-toggle" title="Сменить тему">🌙</button>
    </div>
    <p class="subtitle">Введи продукты или название блюда — покажем рецепты</p>

    <div class="search-box">
      <input 
        type="text" 
        id="ingredientsInput" 
        placeholder="яйца, молоко... или борщ"
      >
      <button id="searchBtn">🔍 Найти</button>
    </div>

    <div class="quick-tags">
      <span>Примеры:</span>
      <button class="tag" data-items="яйца, молоко, мука">яйца, молоко, мука</button>
      <button class="tag" data-items="макароны, сыр, масло">макароны, сыр</button>
      <button class="tag" data-items="картошка, лук, масло">картошка, лук</button>
      <button class="tag" data-items="борщ">борщ</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">🍽 Все</button>
      <button class="filter-btn" data-filter="завтрак">🍳 Завтрак</button>
      <button class="filter-btn" data-filter="суп">🍲 Супы</button>
      <button class="filter-btn" data-filter="второе">🍝 Второе</button>
      <button class="filter-btn" data-filter="салат">🥗 Салаты</button>
      <button class="filter-btn" data-filter="десерт">🍰 Десерты</button>
      <button class="filter-btn" data-filter="быстрое">⏱ Быстрые</button>
    </div>

    <div class="action-row">
      <button id="randomBtn" class="random-btn">🎲 Случайный</button>
      <button id="favoritesBtn" class="favorites-btn">❤️ Избранное (<span id="favCount">0</span>)</button>
      <button id="shoppingBtn" class="shopping-btn">🛒 Покупки (<span id="shopCount">0</span>)</button>
    </div>

    <div id="results" class="results"></div>
  </div>

  <!-- Модальное окно списка покупок -->
  <div id="shoppingModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Список покупок</h2>
        <button id="closeShopping" class="close-btn">✕</button>
      </div>
      <div id="shoppingList" class="shopping-list"></div>
      <button id="clearShopping" class="clear-btn">🗑 Очистить всё</button>
    </div>
  </div>

  <script src="recipes.js"></script>
  <script src="script.js"></script>
</body>
</html>
