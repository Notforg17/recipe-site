<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Что приготовить? — Рецепты из того, что есть</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🍳 Что приготовить?</h1>
    <p class="subtitle">Введи продукты, которые есть дома — покажем, что можно сделать</p>

    <div class="search-box">
      <input 
        type="text" 
        id="ingredientsInput" 
        placeholder="яйца, молоко, мука, сыр..."
      >
      <button id="searchBtn">Найти</button>
    </div>

    <div class="quick-tags">
      <span>Примеры:</span>
      <button class="tag" data-items="яйца, молоко, мука">яйца, молоко, мука</button>
      <button class="tag" data-items="макароны, сыр, масло">макароны, сыр</button>
      <button class="tag" data-items="картошка, лук, масло">картошка, лук</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">🍽 Все</button>
      <button class="filter-btn" data-filter="завтрак">🍳 Завтрак</button>
      <button class="filter-btn" data-filter="суп">🍲 Супы</button>
      <button class="filter-btn" data-filter="второе">🍝 Второе</button>
      <button class="filter-btn" data-filter="салат">🥗 Салаты</button>
      <button class="filter-btn" data-filter="десерт">🍰 Десерты</button>
      <button class="filter-btn" data-filter="быстрое">⏱ Быстрые</button>
    </div>

    <div class="action-row">
      <button id="randomBtn" class="random-btn">🎲 Случайный рецепт</button>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script src="recipes.js"></script>
  <script src="script.js"></script>
</body>
</html>
