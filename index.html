<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Что приготовить? — Рецепты из того, что есть</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Рецепты">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <div class="header">
      <div class="logo">
        <span class="logo-emoji">🍳</span>
        <h1>Что приготовить?</h1>
      </div>
      <button id="themeToggle" class="theme-toggle" title="Сменить тему">🌙</button>
    </div>
    
    <p class="subtitle">✨ 200 рецептов из того, что есть дома</p>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input 
        type="text" 
        id="ingredientsInput" 
        placeholder="яйца, молоко... или борщ"
      >
      <button id="searchBtn">Найти</button>
    </div>

    <div class="quick-tags">
      <span class="tags-label">Попробуй:</span>
      <button class="tag" data-items="яйца, молоко, мука">🥚 яйца, молоко</button>
      <button class="tag" data-items="макароны, сыр, масло">🧀 макароны, сыр</button>
      <button class="tag" data-items="картошка, лук, масло">🥔 картошка, лук</button>
      <button class="tag" data-items="борщ">🍲 борщ</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">🍽 Все</button>
      <button class="filter-btn" data-filter="завтрак">🍳 Завтрак</button>
      <button class="filter-btn" data-filter="суп">🍲 Супы</button>
      <button class="filter-btn" data-filter="второе">🍝 Второе</button>
      <button class="filter-btn" data-filter="салат">🥗 Салаты</button>
      <button class="filter-btn" data-filter="десерт">🍰 Десерты</button>
      <button class="filter-btn" data-filter="быстрое">⏱ Быстрые</button>
    </div>

    <div class="action-row">
      <button id="randomBtn" class="action-btn random-btn">
        <span>🎲</span>
        <span>Случайный</span>
      </button>
      <button id="favoritesBtn" class="action-btn favorites-btn">
        <span>❤️</span>
        <span>Избранное (<span id="favCount">0</span>)</span>
      </button>
      <button id="shoppingBtn" class="action-btn shopping-btn">
        <span>🛒</span>
        <span>Покупки (<span id="shopCount">0</span>)</span>
      </button>
    </div>

    <div id="results" class="results"></div>
  </div>

  <!-- 🤖 Кнопка AI-помощника -->
  <button id="aiBtn" class="ai-fab" title="Спросить AI">🤖</button>

  <!-- 🤖 Модальное окно AI-чата -->
  <div id="aiModal" class="ai-modal">
    <div class="ai-modal-content">
      <div class="ai-modal-header">
        <div class="ai-title">
          <span class="ai-avatar">🤖</span>
          <div>
            <h3>AI-помощник</h3>
            <p class="ai-status">Спроси что угодно про готовку</p>
          </div>
        </div>
        <button id="closeAi" class="close-btn">✕</button>
      </div>
      
      <div id="aiMessages" class="ai-messages">
        <div class="ai-message ai-message-bot">
          <div class="ai-message-content">Привет! 👋 Я твой кулинарный помощник.<br><br>Спроси меня что-нибудь, например:<br>• «Что приготовить из яиц и сыра?»<br>• «Дай рецепт борща»<br>• «Чем заменить молоко?»</div>
        </div>
      </div>
      
      <div class="ai-input-row">
        <input 
          type="text" 
          id="aiInput" 
          placeholder="Спроси что-нибудь..."
          autocomplete="off"
        >
        <button id="aiSend" class="ai-send-btn">➤</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно списка покупок -->
  <div id="shoppingModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Список покупок</h2>
        <button id="closeShopping" class="close-btn">✕</button>
      </div>
      <div id="shoppingList" class="shopping-list"></div>
      <button id="clearShopping" class="clear-btn">🗑 Очистить всё</button>
    </div>
  </div>

  <script src="recipes.js"></script>
  <script src="script.js"></script>
</body>
</html>
